[package]
name = "bot"
version = "0.1.0"
edition = "2021"

[dependencies]
shared = { path = "../shared" }
anyhow = "1"
dotenvy = "0.15"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
rand = "0.8"
quick-xml = "0.36"
resvg = "0.44"
usvg = "0.44"
tiny-skia = "0.11"
serenity = { version = "0.12", default-features = false, features = ["http", "builder", "model", "rustls_backend"] }
