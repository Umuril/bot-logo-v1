[package]
name = "worker"
version = "0.1.0"
edition = "2021"

[features]
default = ["metal"]
metal = ["candle-core/metal", "candle-transformers/metal"]

[dependencies]
shared = { path = "../shared" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
dotenvy = "0.15"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
vtracer = "0.6"
candle-core = "0.11"
candle-transformers = "0.11"
hf-hub = { version = "1.0", default-features = false, features = ["blocking"] }
tokenizers = "0.23"
image = "0.25"
