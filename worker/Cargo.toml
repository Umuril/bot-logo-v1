[package]
name = "worker"
version = "0.1.0"
edition = "2021"

[dependencies]
shared = { path = "../shared" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
dotenvy = "0.15"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
